name: Cleanup Cloudsmith Feature Snapshots
run-name: >
  ${{ github.workflow }}: ${{ github.event_name }} for ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: true
        description: 'Nur auflisten, nicht löschen'
      max-age-days:
        type: number
        default: 1
        description: 'Nur älter als X Tage löschen'
  schedule:
    - cron: '15 4 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: List & delete feature-branch snapshots
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          OWNER: dboeckli
          REPO: dboeckli-cloudsmith-repo
          PACKAGE: spring-6-rest-mvc
          MAX_AGE_DAYS: ${{ inputs.max-age-days != '' && inputs.max-age-days || 1 }}
          DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry-run == true }}
        run: python3 .github/workflows/scripts/cleanup-cloudsmith.py