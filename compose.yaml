services:
  mysql:
    image: 'mysql:8.4.11'
    environment:
      - 'MYSQL_DATABASE=restmvcdb'
      - 'MYSQL_USER=restadmin'
      - 'MYSQL_PASSWORD=password'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
    ports:
      - '3306'
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "restadmin", "-ppassword" ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:19093"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:19093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1" ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  auth-server:
    container_name: auth-server
    image: domboeckli/spring-6-auth-server:0.0.11-snapshot
    ports:
      - "9000:9000"
    expose:
      - 9000
    environment:
      SPRING_SECURITY_OAUTH2_AUTHORIZATION_SERVER_ISSUER: http://localhost:9000

  # Drink-preparation saga participants.
  # Each service overrides its Kafka bootstrap (default is [::1]:29092) to the in-network broker
  # and disables Spring Boot Docker Compose (it must not spawn its own broker inside the container).
  cold-micro-service:
    container_name: cold-micro-service
    image: ghcr.io/dboeckli/spring-6-cold-micro-service:0.0.1-snapshot
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8091:8081"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_APPLICATION_JSON: '{"spring":{"kafka":{"bootstrap-servers":"kafka:9092","admin":{"properties":{"bootstrap-servers":"kafka:9092"}},"consumer":{"bootstrap-servers":"kafka:9092"},"producer":{"bootstrap-servers":"kafka:9092"}}}}'

  cool-micro-service:
    container_name: cool-micro-service
    image: ghcr.io/dboeckli/spring-6-cool-micro-service:0.0.1-snapshot
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8092:8082"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_APPLICATION_JSON: '{"spring":{"kafka":{"bootstrap-servers":"kafka:9092","admin":{"properties":{"bootstrap-servers":"kafka:9092"}},"consumer":{"bootstrap-servers":"kafka:9092"},"producer":{"bootstrap-servers":"kafka:9092"}}}}'

  icecold-micro-service:
    container_name: icecold-micro-service
    image: ghcr.io/dboeckli/spring-6-icecold-micro-service:0.0.1-snapshot
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_APPLICATION_JSON: '{"spring":{"kafka":{"bootstrap-servers":"kafka:9092","admin":{"properties":{"bootstrap-servers":"kafka:9092"}},"consumer":{"bootstrap-servers":"kafka:9092"},"producer":{"bootstrap-servers":"kafka:9092"}}}}'

  # Readiness gate: reports healthy only when auth-server and all drink microservices answer
  # /actuator/health/readiness with UP (mirrors the busybox pattern used in spring-6-gateway).
  # Kafka is implicitly gated: the microservices only become ready after the broker is healthy.
  busybox:
    container_name: busybox
    image: busybox:1.38.0
    depends_on:
      auth-server:
        condition: service_started
        required: true
      cold-micro-service:
        condition: service_started
        required: true
      cool-micro-service:
        condition: service_started
        required: true
      icecold-micro-service:
        condition: service_started
        required: true
    healthcheck:
      test: [ "CMD", "sh", "-c", "
            echo 'Checking BusyBox readiness...' &&
            test -f /bin/sh &&
            wget -qO- http://auth-server:9000/actuator/health/readiness | grep -q '\"status\":\"UP\"' &&
            wget -qO- http://cold-micro-service:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"' &&
            wget -qO- http://cool-micro-service:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"' &&
            wget -qO- http://icecold-micro-service:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'
          " ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      /bin/sh -c '
      while true; do
        auth_health=$$(wget -q -O - http://auth-server:9000/actuator/health/readiness 2>/dev/null)
        cold_health=$$(wget -q -O - http://cold-micro-service:8081/actuator/health/readiness 2>/dev/null)
        cool_health=$$(wget -q -O - http://cool-micro-service:8082/actuator/health/readiness 2>/dev/null)
        icecold_health=$$(wget -q -O - http://icecold-micro-service:8080/actuator/health/readiness 2>/dev/null)

        echo "{
          \"timestamp\": \"$$(date -Iseconds)\",
          \"services\": {
            \"auth-server\": $$auth_health,
            \"cold-micro-service\": $$cold_health,
            \"cool-micro-service\": $$cool_health,
            \"icecold-micro-service\": $$icecold_health
          }
        }"
        sleep 15
      done
      '
